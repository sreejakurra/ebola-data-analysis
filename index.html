
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ebola Data Analysis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="page-header">
        <h1>Ebola Outbreak: Data Analysis</h1>
        <p>Exploring the 2014 Ebola outbreak through data visualizations</p>
    </header>

    <main>
        <section id="gallery" class="gallery"></section>
    </main>

    <div id="viewer" class="viewer hidden">
        <div class="viewer-content">
            <button id="closeButton" class="close-button" aria-label="Close">
                &times;
            </button>

            <h2 id="viewerTitle"></h2>

            <img id="largeGraph" src="" alt="Enlarged graph">

            <div id="viewerNotes" class="viewer-notes"></div>
            <div id="viewerResearch" class="viewer-research"></div>

            <div class="viewer-actions">
                <button id="viewCodeButton" type="button">View Code</button>
            </div>

            <section id="codePanel" class="code-panel hidden">
                <div class="code-heading">
                    <h3>Python Code</h3>
                    <button id="copyButton" type="button">Copy Code</button>
                </div>
                <pre><code id="pythonCode"></code></pre>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
